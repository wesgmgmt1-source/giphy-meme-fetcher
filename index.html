<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giphy Meme Fetcher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-1">Just a chill guy, fetching GIFs</h1>
    <p class="lead mb-4">Hit the button for chill guy, or search for anything else.</p>

    <div class="input-group mb-4">
      <input type="text" id="search-input" class="form-control" placeholder="Search for a GIF (leave blank for chill guy)">
      <button id="fetch-btn" class="btn btn-fetch">Fetch a GIF</button>
    </div>

    <div id="gif-container" class="row"></div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
